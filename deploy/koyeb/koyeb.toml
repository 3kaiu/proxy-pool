# Koyeb 部署配置 - 免费且不需要信用卡
#
# 部署步骤：
#   1. 注册 https://www.koyeb.com （用 GitHub 登录）
#   2. Create Service -> GitHub -> 选 3kaiu/proxy-pool
#   3. Builder 选 Docker，端口 5010
#   4. 部署后拿到 https://xxx.koyeb.app
#
# 防休眠：用 UptimeRobot (免费) 每 5 分钟 ping https://your-app.koyeb.app/count
#
# 使用：
#   模型：GET  https://your-app.koyeb.app/v1/models
#   聊天：POST https://your-app.koyeb.app/v1/chat/completions
#   状态：GET  https://your-app.koyeb.app/count

[service]
  name = "proxy-pool"
  dockerfile = "Dockerfile"
  port = 5010
  health_check = "/count"

[env]
  RELAY_LISTEN = ":5010"
  RELAY_TARGET = "https://opencode.ai/zen"
  RELAY_MAX_RETRIES = "50"
  RELAY_TIMEOUT = "5"
