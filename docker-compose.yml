version: "3.8"

services:
  proxy-pool:
    build: .
    image: proxy-pool:latest
    container_name: proxy-pool
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      - PROXY_POOL_TARGET_URL=https://opencode.ai/zen/v1/models
      - PROXY_POOL_LISTEN=:5010
      # - PROXY_POOL_API_KEY=your_secret_key
    volumes:
      - ./data:/app/data
    # Optionally mount a sqlite db directory if we want it persisted
    # working_dir: /app/data
